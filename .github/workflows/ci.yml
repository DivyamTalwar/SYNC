name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sync-system/requirements.txt
      - name: Install
        run: pip install "fastapi>=0.104.0" "pyjwt>=2.8.0"
      - name: Validate package metadata
        working-directory: sync-system
        run: python setup.py --name --version
      - name: Compile source
        run: python -m compileall -q sync-system/src sync-system/api sync-system/config
      - name: Run tests
        run: python -m unittest discover -s sync-system/tests -v
